name: pr-title-lint

# Enforces Conventional-Commit PR titles so the squashed commit subject (= PR title)
# is deterministic. Modelled on app-vitals/shipwright's pr-title-lint.yml.

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Conventional-Commit PR title
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6 (post-v5.5.2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
